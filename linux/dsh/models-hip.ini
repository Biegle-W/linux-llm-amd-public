# Dual-AMD CPU expert backing + GPU hot-expert cache. Both devices required.
# CPU expert placement is explicit in override-tensor; n-cpu-moe=0 avoids a second contiguous-layer override.
version = 1

[*]
n-gpu-layers = 99
fit = off
device = ROCm0,ROCm1
split-mode = layer
tensor-split = 1,1
override-tensor = token_embd.*=ROCm0
parallel = 1
batch-size = 512
ubatch-size = 128
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
reasoning = off
cache-ram = 0
ctx-checkpoints = 0
chat-template-kwargs = {"enable_thinking":false}
spec-type = none

