# Dual AMD: explicit VRAM-only or CPU expert backing per validated model. Both devices required.
# CPU expert placement is explicit in override-tensor; n-cpu-moe=0 avoids a second contiguous-layer override.
version = 1

[*]
n-gpu-layers = 99
fit = off
device = ROCm0,ROCm1
split-mode = layer
tensor-split = 1,1
override-tensor = token_embd.*=ROCm0
parallel = 1
batch-size = 512
ubatch-size = 128
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
reasoning = off
cache-ram = 0
ctx-checkpoints = 0
chat-template-kwargs = {"enable_thinking":false}
spec-type = none

[empero-qwen3.8-35b-a3b]
model = /mnt/shared/GGUF-Models/Empero-Qwen3.8-35B-A3B-Distill/Qwen3.8-35B-A3B-IQ4_XS.gguf
ctx-size = 262144
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
temp = 0.6
top-p = 0.95
top-k = 20
device = ROCm0,ROCm1
split-mode = layer
tensor-split = 1,1
n-gpu-layers = 99
fit = off
override-tensor = token_embd.*=ROCm0
