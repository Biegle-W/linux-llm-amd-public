# Dual AMD: explicit VRAM-only or CPU expert backing per validated model. Both devices required.
# CPU expert placement is explicit in override-tensor; n-cpu-moe=0 avoids a second contiguous-layer override.
version = 1

[*]
n-gpu-layers = 99
fit = off
device = ROCm0,ROCm1
split-mode = layer
tensor-split = 1,1
override-tensor = token_embd.*=ROCm0
parallel = 1
batch-size = 512
ubatch-size = 128
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
reasoning = off
cache-ram = 0
ctx-checkpoints = 0
chat-template-kwargs = {"enable_thinking":false}
spec-type = none

[empero-qwen3.8-35b-a3b]
model = /mnt/shared/GGUF-Models/Empero-Qwen3.8-35B-A3B-Distill/Qwen3.8-35B-A3B-IQ4_XS.gguf
ctx-size = 262144
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
temp = 0.6
top-p = 0.95
top-k = 20
device = ROCm0,ROCm1
split-mode = layer
tensor-split = 1,1
n-gpu-layers = 99
fit = off
override-tensor = token_embd.*=ROCm0
n-cpu-moe = 0
moe-cache-mib = 0
load-mode = dio
threads = 6
threads-batch = 6
batch-size = 512
ubatch-size = 512
cache-ram = 0
ctx-checkpoints = 0

# Inkling 2 Mini (looped MoE, 128 experts). All 48 layer visits run on the second card; the four large
# expert blocks (20-23) and the output layer sit on the display card. f16 KV: quantized KV is unmeasured here.
# Runs on the RDNA3 branch build named in llama-runtime.json (source_overrides), not on the global source.
[inkling-2-mini-q8]
model = /mnt/shared/GGUF-Models/Inkling-2-Mini/Inkling-2-Mini-UD-Q8_K_XL.mainline.gguf
ctx-size = 131072
spec-type = none
temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
device = ROCm1,ROCm0
split-mode = layer
tensor-split = 48,1
n-gpu-layers = 99
fit = off
override-tensor = ^blk[.]2[0-3][.]ffn_(gate_up|down)_exps[.]weight$=ROCm0,^output[.]weight$=ROCm0
n-cpu-moe = 0
moe-cache-mib = 0
load-mode = dio
threads = 6
threads-batch = 6
batch-size = 2048
ubatch-size = 512
cache-type-k = f16
cache-type-v = f16
cache-ram = 0
ctx-checkpoints = 0
chat-template-kwargs = {"reasoning_effort":"none"}
