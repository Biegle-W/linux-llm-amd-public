# Validated HIP alternative; Vulkan remains selected for faster Bolt decode.
version = 1

[nemotron-3.5-bolt]
model = /mnt/llm-models/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-GGUF/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB.gguf
ctx-size = 65536
device = ROCm0
split-mode = none
n-gpu-layers = 99
fit = off
override-tensor = token_embd.*=ROCm0
parallel = 1
batch-size = 512
ubatch-size = 128
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
cache-ram = 0
ctx-checkpoints = 0
jinja = true
reasoning = off
chat-template-kwargs = {"enable_thinking":false}
spec-type = none
temp = 1.0
top-p = 0.95
