# Dual-AMD dense GPU profiles; cached MoE profiles are in models-hip.ini.
version = 1

[*]
n-gpu-layers = 99
fit = off
device = Vulkan0,Vulkan1
split-mode = layer
tensor-split = 1,1
override-tensor = token_embd.*=Vulkan0
parallel = 1
batch-size = 512
ubatch-size = 128
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
reasoning = off
cache-ram = 0
ctx-checkpoints = 0
chat-template-kwargs = {"enable_thinking":false}
spec-type = none

[qwen3.8-27b-q4]
model = /mnt/shared/GGUF-Models/Qwen3.8-27B-Q4/Qwen3.8-27B-UD-Q4_K_M.gguf
ctx-size = 65536
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0

[muse-glimmer-30b]
model = /mnt/shared/GGUF-Models/Muse-Glimmer-30B-GGUF/Muse-Glimmer-30B-UD-Q4_K_XL.gguf
ctx-size = 32768
